<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Math Inquiry 数学思考伙伴</title>
  <desc id="desc">浅绿、深绿与米色的项目装饰横幅。右侧以概念、条件、例题和数学思想四个词作结构示意，不表示实际数据或已完成的知识图谱。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5e9"/>
      <stop offset="1" stop-color="#e6f0e5"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbf5"/>
      <stop offset="1" stop-color="#e9f2e7"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="318" rx="24" fill="url(#paper)" stroke="#cadbc9" stroke-width="2"/>
  <circle cx="1213" cy="-12" r="134" fill="#d7e8d6" opacity="0.55"/>
  <circle cx="682" cy="336" r="125" fill="#f2ebd5" opacity="0.8"/>
